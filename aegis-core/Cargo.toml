[package]
name = "aegis-core"
version = "0.1.0"
edition = "2021"

[dependencies]
nokhwa = { version = "0.10.0", features = ["input-v4l"] }
image = "0.24.9"
ndarray = "0.15.6"
rustfft = "6.1.0"
tokio = { version = "1.37.0", features = ["full"] }
anyhow = "1.0.81"
rustface = "0.1.7"
base64 = "0.21.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rodio = "0.17"
symphonia = { version = "0.5", features = ["mp3", "flac", "isomp4", "aac"] }
rdev = "0.5"
